<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04030a">
<title>Feliz Día de las Flores Amarillas</title>
<style>
:root{
  --gold: #ffd27a;
  --gold-soft: #ffe6b3;
  --gold-deep: #c9922f;
  --bg: #04030a;
}

*{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body{
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  /* gestos propios: nada de scroll, pull-to-refresh ni zoom del navegador */
  touch-action: none;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}

body{
  position: fixed;
  inset: 0;
  height: 100dvh;
  font-family: Georgia, 'Times New Roman', serif;
  color: var(--gold-soft);
  cursor: grab;
}

body.dragging{ cursor: grabbing; }

#scene{
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

#vignette{
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,0.6) 100%);
  z-index: 5;
}

/* ---------- Título fijo ---------- */

#titleBlock{
  position: fixed;
  top: max(18px, env(safe-area-inset-top));
  left: 0;
  right: 0;
  z-index: 10;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 2s ease, transform 2s ease;
  padding: 0 16px;
}

#titleBlock.visible{ opacity: 1; transform: translateY(0); }

#titleMain{
  font-size: clamp(19px, 5.6vw, 30px);
  font-weight: 400;
  font-style: italic;
  color: var(--gold-soft);
  letter-spacing: 0.02em;
  text-shadow: 0 0 16px rgba(255,210,122,.45), 0 0 38px rgba(255,190,90,.2);
}

#titleSub{
  margin-top: 2px;
  font-size: clamp(15px, 4.2vw, 21px);
  font-weight: 400;
  font-style: italic;
  color: var(--gold);
  opacity: .92;
  text-shadow: 0 0 14px rgba(255,210,122,.42);
}

.flowerGlyph{ filter: drop-shadow(0 0 8px rgba(255,200,90,.55)); }

/* ---------- Indicación mínima ---------- */

#hint{
  position: fixed;
  bottom: max(34px, calc(env(safe-area-inset-bottom) + 20px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 10;
  font-size: clamp(11px, 3vw, 13px);
  letter-spacing: .2em;
  text-transform: uppercase;
  color: var(--gold-soft);
  text-shadow: 0 0 12px rgba(255,214,148,.35);
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.6s ease;
}

#hint.visible{ opacity: .6; animation: hintBreath 3.4s ease-in-out infinite; }

@keyframes hintBreath{
  0%,100%{ opacity:.35; }
  50%{ opacity:.7; }
}

/* ---------- Brújula sutil ---------- */

#compass{
  position: fixed;
  z-index: 9;
  left: 50%;
  top: 50%;
  width: 34px;
  height: 34px;
  margin: -17px 0 0 -17px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--gold);
  font-size: 15px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .8s ease;
  text-shadow: 0 0 10px rgba(255,200,110,.6);
}

#compass.visible{ opacity: .45; }

/* ---------- Intro ---------- */

#intro{
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: #04030a;
  cursor: pointer;
  transition: opacity 1.6s ease;
}

#intro.hidden{ opacity: 0; pointer-events: none; }

#introGlyph{
  font-size: clamp(28px, 8vw, 40px);
  color: var(--gold);
  text-shadow: 0 0 18px rgba(255,210,122,.55), 0 0 40px rgba(255,210,122,.25);
  animation: introPulse 2.6s ease-in-out infinite;
}

#introText{
  font-size: clamp(13px, 3.6vw, 16px);
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold-soft);
  opacity: .75;
  text-shadow: 0 0 12px rgba(255,214,148,.35);
  animation: introFade 2.6s ease-in-out infinite;
}

@keyframes introPulse{
  0%,100%{ transform: scale(1); opacity:.85; }
  50%{ transform: scale(1.18); opacity:1; }
}

@keyframes introFade{
  0%,100%{ opacity:.55; }
  50%{ opacity:.95; }
}

</style>
</head>
<body>

  <!-- Universo: todo se dibuja aquí -->
  <canvas id="scene"></canvas>

  <div id="vignette"></div>

  <!-- Título fijo en el espacio de pantalla -->
  <header id="titleBlock">
    <h1 id="titleMain">Feliz Día de las Flores</h1>
    <h2 id="titleSub">Amarillas <span class="flowerGlyph">🌻</span></h2>
  </header>

  <!-- Indicación mínima, desaparece sola -->
  <div id="hint">Arrastra para explorar</div>

  <!-- Brújula sutil: señala hacia el corazón si te alejas mucho -->
  <div id="compass"><span id="compassArrow">➜</span></div>

  <!-- Pantalla inicial -->
  <div id="intro">
    <div id="introGlyph">✨</div>
    <div id="introText">Toca para entrar</div>
  </div>

  <script>
/* =============================================================
   UN PEQUEÑO UNIVERSO ROMÁNTICO
   Espacio explorable con cámara, parallax, partículas y eventos.
   Canvas puro, sin dependencias.
   ============================================================= */

(() => {
  'use strict';

  /* =========================================================
     1. UTILIDADES
     ========================================================= */

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });

  const introEl = document.getElementById('intro');
  const titleEl = document.getElementById('titleBlock');
  const hintEl = document.getElementById('hint');
  const compassEl = document.getElementById('compass');
  const compassArrow = document.getElementById('compassArrow');

  let W = 0, H = 0, DPR = 1;

  const rand = (a, b) => a + Math.random() * (b - a);
  const randInt = (a, b) => Math.floor(rand(a, b + 1));
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const pick = arr => arr[randInt(0, arr.length - 1)];

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 250));
  resize();

  /* =========================================================
     2. CALIDAD SEGÚN DISPOSITIVO
     ========================================================= */

  function detectQuality() {
    const cores = navigator.hardwareConcurrency || 4;
    const mem = navigator.deviceMemory || 4;
    const area = window.innerWidth * window.innerHeight;
    let score = 0;
    score += cores >= 8 ? 2 : cores >= 4 ? 1 : 0;
    score += mem >= 6 ? 2 : mem >= 4 ? 1 : 0;
    score += area <= 520000 ? 1 : 0;
    if (score >= 4) return 'high';
    if (score >= 2) return 'mid';
    return 'low';
  }

  const QUALITY = detectQuality();
  const Q = {
    high: { bg: 300, main: 440, glow: true, blur: 12, tails: true, maxBurst: 26 },
    mid:  { bg: 190, main: 290, glow: true, blur: 7,  tails: true, maxBurst: 18 },
    low:  { bg: 100, main: 165, glow: false, blur: 0, tails: false, maxBurst: 10 }
  }[QUALITY];

  /* =========================================================
     3. EL MUNDO
     ========================================================= */

  const WORLD = { w: 3000, h: 5000 };
  const CENTER = { x: WORLD.w / 2, y: WORLD.h / 2 };

  const GOLD_HUES = [38, 42, 45, 48, 51];

  // Capas de profundidad (factor de parallax y de escala)
  const DEPTH = { BG: 0.45, MID: 1.0, FG: 1.45 };

  /* =========================================================
     4. CÁMARA
     ========================================================= */

  const cam = {
    x: CENTER.x, y: CENTER.y + 900,
    tx: CENTER.x, ty: CENTER.y + 900,
    zoom: 1, tzoom: 1,
    vx: 0, vy: 0
  };

  const ZOOM_MIN = 0.55;
  const ZOOM_MAX = 2.4;

  function clampCamera() {
    const halfW = (W / 2) / cam.tzoom;
    const halfH = (H / 2) / cam.tzoom;
    const marginX = Math.max(0, WORLD.w / 2 - halfW) + 260;
    const marginY = Math.max(0, WORLD.h / 2 - halfH) + 260;
    cam.tx = clamp(cam.tx, CENTER.x - marginX, CENTER.x + marginX);
    cam.ty = clamp(cam.ty, CENTER.y - marginY, CENTER.y + marginY);
  }

  function updateCamera(dt) {
    if (!isDragging) {
      cam.tx -= cam.vx;
      cam.ty -= cam.vy;
      cam.vx *= 0.94;
      cam.vy *= 0.94;
      if (Math.abs(cam.vx) < 0.01) cam.vx = 0;
      if (Math.abs(cam.vy) < 0.01) cam.vy = 0;
    }
    clampCamera();
    const k = 1 - Math.pow(0.0001, dt / 1000); // suavizado estable a cualquier FPS
    cam.x = lerp(cam.x, cam.tx, k);
    cam.y = lerp(cam.y, cam.ty, k);
    cam.zoom = lerp(cam.zoom, cam.tzoom, k);
  }

  // Mundo -> pantalla, con parallax por profundidad
  function sx(wx, depth) { return W / 2 + (wx - cam.x) * cam.zoom * depth; }
  function sy(wy, depth) { return H / 2 + (wy - cam.y) * cam.zoom * depth; }
  function scaleOf(depth) { return cam.zoom * depth; }

  // Pantalla -> mundo (capa media, donde ocurre la interacción)
  function toWorldX(px) { return cam.x + (px - W / 2) / cam.zoom; }
  function toWorldY(py) { return cam.y + (py - H / 2) / cam.zoom; }

  function visible(wx, wy, depth, pad) {
    const s = scaleOf(depth);
    const hw = (W / 2) / s + (pad || 60);
    const hh = (H / 2) / s + (pad || 60);
    return Math.abs(wx - cam.x) < hw && Math.abs(wy - cam.y) < hh;
  }

  /* =========================================================
     5. ENTRADA: ratón, táctil y pinch
     ========================================================= */

  const pointers = new Map();
  let isDragging = false;
  let dragMoved = 0;
  let lastPinchDist = 0;
  let holding = false;
  let pointerWorld = { x: CENTER.x, y: CENTER.y, active: false };
  let started = false;

  function pointerDown(e) {
    if (!started) return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignorar */ }
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    pointerWorld.x = toWorldX(e.clientX);
    pointerWorld.y = toWorldY(e.clientY);
    pointerWorld.active = true;

    if (pointers.size === 1) {
      isDragging = true;
      dragMoved = 0;
      holding = true;
      cam.vx = 0; cam.vy = 0;
      document.body.classList.add('dragging');
    } else if (pointers.size === 2) {
      const two = [...pointers.values()];
      lastPinchDist = Math.hypot(two[0].x - two[1].x, two[0].y - two[1].y);
      holding = false;
      isDragging = false;
    }
    hideHint();
  }

  function pointerMove(e) {
    if (!started) return;

    if (!pointers.has(e.pointerId)) {
      // hover del ratón: interactúa con las partículas sin arrastrar
      pointerWorld.x = toWorldX(e.clientX);
      pointerWorld.y = toWorldY(e.clientY);
      pointerWorld.active = true;
      return;
    }

    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    pointerWorld.x = toWorldX(e.clientX);
    pointerWorld.y = toWorldY(e.clientY);
    pointerWorld.active = true;

    if (pointers.size === 1 && isDragging) {
      dragMoved += Math.hypot(dx, dy);
      cam.tx -= dx / cam.zoom;
      cam.ty -= dy / cam.zoom;
      cam.vx = (dx / cam.zoom) * 0.55;
      cam.vy = (dy / cam.zoom) * 0.55;
      clampCamera();
      if (dragMoved > 12) holding = false;
    } else if (pointers.size === 2) {
      const two = [...pointers.values()];
      const d = Math.hypot(two[0].x - two[1].x, two[0].y - two[1].y);
      if (lastPinchDist > 0) {
        const mx = (two[0].x + two[1].x) / 2;
        const my = (two[0].y + two[1].y) / 2;
        applyZoom(d / lastPinchDist, mx, my);
      }
      lastPinchDist = d;
      // desplazamiento simultáneo con dos dedos
      cam.tx -= (dx / cam.zoom) / 2;
      cam.ty -= (dy / cam.zoom) / 2;
      clampCamera();
    }
  }

  function pointerUp(e) {
    if (pointers.has(e.pointerId)) pointers.delete(e.pointerId);
    if (pointers.size < 2) lastPinchDist = 0;
    if (pointers.size === 0) {
      // toque corto = interacción, no arrastre
      if (isDragging && dragMoved < 10) touchBurst(pointerWorld.x, pointerWorld.y);
      isDragging = false;
      holding = false;
      document.body.classList.remove('dragging');
    } else if (pointers.size === 1) {
      // al levantar un dedo del pinch, seguir arrastrando con el que queda
      isDragging = true;
      dragMoved = 99;
    }
  }

  function applyZoom(factor, anchorX, anchorY) {
    const before = cam.tzoom;
    const next = clamp(before * factor, ZOOM_MIN, ZOOM_MAX);
    if (next === before) return;
    // el punto del mundo bajo el ancla no se mueve
    const wx = cam.tx + (anchorX - W / 2) / before;
    const wy = cam.ty + (anchorY - H / 2) / before;
    cam.tzoom = next;
    cam.tx = wx - (anchorX - W / 2) / next;
    cam.ty = wy - (anchorY - H / 2) / next;
    clampCamera();
  }

  canvas.addEventListener('pointerdown', pointerDown);
  canvas.addEventListener('pointermove', pointerMove);
  window.addEventListener('pointerup', pointerUp);
  window.addEventListener('pointercancel', pointerUp);
  canvas.addEventListener('pointerleave', () => { pointerWorld.active = false; });

  canvas.addEventListener('wheel', e => {
    if (!started) return;
    e.preventDefault();
    applyZoom(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX, e.clientY);
  }, { passive: false });

  // bloquear gestos nativos molestos (zoom de página, selección, refresco)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
    document.addEventListener(ev, e => e.preventDefault(), { passive: false })
  );
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if (started) e.preventDefault(); }, { passive: false });

  // teclado opcional en escritorio
  window.addEventListener('keydown', e => {
    if (!started) return;
    const step = 140 / cam.zoom;
    if (e.key === 'ArrowLeft') cam.tx -= step;
    else if (e.key === 'ArrowRight') cam.tx += step;
    else if (e.key === 'ArrowUp') cam.ty -= step;
    else if (e.key === 'ArrowDown') cam.ty += step;
    else if (e.key === '+' || e.key === '=') applyZoom(1.12, W / 2, H / 2);
    else if (e.key === '-') applyZoom(1 / 1.12, W / 2, H / 2);
    else return;
    clampCamera();
  });

  /* =========================================================
     6. PARTÍCULAS DEL MUNDO (sistema permanente)
     ========================================================= */

  const MODE = { FREE: 0, SEEK: 1, HELD: 2, RETURN: 3 };
  const SHAPE = { DOT: 0, STAR: 1, HEART: 2 };

  class Particle {
    constructor(layer) {
      this.layer = layer;
      this.init(true);
    }
    init(anywhere) {
      if (anywhere) {
        this.x = rand(0, WORLD.w);
        this.y = rand(0, WORLD.h);
      }
      const far = this.layer === DEPTH.BG;
      this.vx = rand(-0.08, 0.08);
      this.vy = rand(-0.24, -0.04);
      this.base = far ? rand(0.5, 1.5) : rand(1, 3.2);
      this.size = this.base;
      this.alpha = 0;
      this.target = far ? rand(0.18, 0.5) : rand(0.35, 0.9);
      this.hue = pick(GOLD_HUES) + rand(-4, 4);
      this.light = far ? rand(52, 66) : rand(58, 78);
      const r = Math.random();
      this.shape = r < 0.03 ? SHAPE.STAR : r < 0.05 ? SHAPE.HEART : SHAPE.DOT;
      this.mode = MODE.FREE;
      this.tx = 0; this.ty = 0;
      this.ox = 0; this.oy = 0;
      this.t0 = 0;
      this.dur = 1400;
      this.phase = rand(0, Math.PI * 2);
      this.speedPhase = rand(0.02, 0.055);
      this.drift = rand(0.5, 1.3);
      this.affinity = Math.random() < 0.35 ? -1 : 1; // unas huyen, otras se acercan
      this.px = this.x; this.py = this.y;
      this.owner = null;
      this.temp = false;
      this.life = 0;
      this.maxLife = 0;
      this.dead = false;
    }

    seek(tx, ty, delay, duration, owner) {
      this.tx = tx; this.ty = ty;
      this.ox = this.x; this.oy = this.y;
      this.t0 = now + delay;
      this.dur = duration;
      this.mode = MODE.SEEK;
      this.owner = owner;
      this.target = rand(0.72, 1);
    }

    release() {
      this.mode = MODE.RETURN;
      this.owner = null;
      this.t0 = now;
      const a = rand(0, Math.PI * 2);
      const s = rand(0.3, 1.1);
      this.vx = Math.cos(a) * s;
      this.vy = Math.sin(a) * s - 0.2;
      this.target = this.layer === DEPTH.BG ? rand(0.18, 0.5) : rand(0.35, 0.85);
    }

    update(dt) {
      this.px = this.x; this.py = this.y;
      this.phase += this.speedPhase * dt * 0.06;

      if (this.mode === MODE.SEEK) {
        const el = now - this.t0;
        if (el > 0) {
          const t = clamp(el / this.dur, 0, 1);
          const e = easeInOutCubic(t);
          // torbellino: no viaja en línea recta hacia su sitio
          const dx = this.tx - this.ox, dy = this.ty - this.oy;
          const len = Math.hypot(dx, dy) || 1;
          const nx = -dy / len, ny = dx / len;
          const swirl = Math.sin(e * Math.PI) * 48 * this.affinity;
          this.x = lerp(this.ox, this.tx, e) + nx * swirl;
          this.y = lerp(this.oy, this.ty, e) + ny * swirl;
          if (t >= 1) this.mode = MODE.HELD;
        }
        this.alpha += (this.target - this.alpha) * 0.05;
      } else if (this.mode === MODE.HELD) {
        // nunca se queda inmóvil: vibra alrededor de su punto
        this.x = this.tx + Math.sin(this.phase * 1.4) * 1.9;
        this.y = this.ty + Math.cos(this.phase * 1.15) * 1.9;
        this.alpha += (this.target - this.alpha) * 0.06;
      } else {
        // corriente orgánica del universo
        const ang =
          Math.sin(this.x * 0.0016 + timeSec * 0.16) * 1.7 +
          Math.cos(this.y * 0.0013 - timeSec * 0.12) * 1.7;
        this.vx += Math.cos(ang) * 0.012;
        this.vy += Math.sin(ang) * 0.012 - 0.006; // leve ascenso
        this.vx *= 0.985;
        this.vy *= 0.985;
        this.vx = clamp(this.vx, -0.9, 0.9);
        this.vy = clamp(this.vy, -1.1, 0.6);
        this.x += this.vx * this.drift;
        this.y += this.vy * this.drift;
        this.alpha += (this.target - this.alpha) * 0.02;
        if (this.mode === MODE.RETURN && now - this.t0 > 1500) this.mode = MODE.FREE;
      }

      // reacción al cursor / dedo
      if (pointerWorld.active && this.layer !== DEPTH.BG && this.mode !== MODE.HELD) {
        const dx = this.x - pointerWorld.x;
        const dy = this.y - pointerWorld.y;
        const d2 = dx * dx + dy * dy;
        const R = holding ? 210 : 135;
        if (d2 < R * R && d2 > 1) {
          const d = Math.sqrt(d2);
          const force = (1 - d / R) * (holding ? 0.9 : 0.55) * this.affinity;
          this.vx += (dx / d) * force * 0.5;
          this.vy += (dy / d) * force * 0.5;
          this.alpha = Math.min(1, this.alpha + 0.03);
        }
      }

      // el mundo envuelve: el sistema nunca se vacía
      if (this.mode === MODE.FREE && !this.temp) {
        if (this.x < -200) this.x = WORLD.w + 200;
        else if (this.x > WORLD.w + 200) this.x = -200;
        if (this.y < -200) this.y = WORLD.h + 200;
        else if (this.y > WORLD.h + 200) this.y = -200;
      }

      if (this.temp) {
        this.life += dt;
        if (this.life > this.maxLife) {
          this.target = 0;
          if (this.alpha < 0.02) this.dead = true;
        }
      }

      const flick = 0.72 + 0.28 * Math.sin(this.phase);
      this.size = this.base * flick;
    }

    draw(g) {
      if (this.alpha <= 0.015) return;
      const d = this.layer;
      if (!visible(this.x, this.y, d, 40)) return;
      const X = sx(this.x, d), Y = sy(this.y, d);
      const s = Math.max(this.size * scaleOf(d), 0.35);
      const color = `hsla(${this.hue}, 92%, ${this.light}%, 1)`;

      g.globalAlpha = clamp(this.alpha, 0, 1);
      if (Q.glow) {
        g.shadowBlur = Q.blur * clamp(s / 2, 0.4, 2.2);
        g.shadowColor = color;
      }

      if (Q.tails && this.mode !== MODE.HELD) {
        const vx = this.x - this.px, vy = this.y - this.py;
        if (Math.hypot(vx, vy) > 0.55) {
          g.strokeStyle = color;
          g.globalAlpha = clamp(this.alpha * 0.4, 0, 1);
          g.lineWidth = Math.max(s * 0.6, 0.3);
          g.beginPath();
          g.moveTo(X, Y);
          g.lineTo(X - vx * scaleOf(d) * 2.4, Y - vy * scaleOf(d) * 2.4);
          g.stroke();
          g.globalAlpha = clamp(this.alpha, 0, 1);
        }
      }

      if (this.shape === SHAPE.DOT) {
        g.fillStyle = color;
        g.beginPath();
        g.arc(X, Y, s, 0, Math.PI * 2);
        g.fill();
      } else if (this.shape === SHAPE.STAR) {
        drawSpark(g, X, Y, s * 2.4, color);
      } else {
        drawMiniHeart(g, X, Y, s * 1.7, color);
      }
      g.shadowBlur = 0;
    }
  }

  function drawSpark(g, x, y, r, color) {
    g.strokeStyle = color;
    g.lineWidth = Math.max(r * 0.13, 0.35);
    g.beginPath();
    g.moveTo(x - r, y); g.lineTo(x + r, y);
    g.moveTo(x, y - r); g.lineTo(x, y + r);
    g.stroke();
  }

  function drawMiniHeart(g, x, y, s, color) {
    g.fillStyle = color;
    g.beginPath();
    g.moveTo(x, y + s * 0.32);
    g.bezierCurveTo(x - s, y - s * 0.62, x - s * 0.4, y - s * 1.22, x, y - s * 0.5);
    g.bezierCurveTo(x + s * 0.4, y - s * 1.22, x + s, y - s * 0.62, x, y + s * 0.32);
    g.fill();
  }

  const bgParticles = [];
  const mainParticles = [];
  for (let i = 0; i < Q.bg; i++) bgParticles.push(new Particle(DEPTH.BG));
  for (let i = 0; i < Q.main; i++) mainParticles.push(new Particle(DEPTH.MID));

  // partículas temporales (toques, eventos, girasoles)
  const temps = [];
  function spawnTemp(x, y, opts) {
    opts = opts || {};
    if (temps.length > Q.main * 0.8) return null;
    const p = new Particle(DEPTH.MID);
    p.x = x; p.y = y;
    p.px = x; p.py = y;
    p.vx = opts.vx !== undefined ? opts.vx : rand(-1, 1);
    p.vy = opts.vy !== undefined ? opts.vy : rand(-1, 1);
    p.base = opts.size || rand(1, 3);
    p.target = opts.alpha !== undefined ? opts.alpha : rand(0.5, 1);
    p.alpha = 0.25;
    if (opts.shape !== undefined) p.shape = opts.shape;
    p.temp = true;
    p.maxLife = opts.maxLife || rand(1600, 3600);
    p.life = 0;
    temps.push(p);
    return p;
  }

  function touchBurst(wx, wy) {
    ripples.push({ x: wx, y: wy, r: 4, a: 0.55 });
    for (let i = 0; i < Q.maxBurst; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(0.6, 2.6);
      spawnTemp(wx, wy, {
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 0.3,
        size: rand(1, 3.2),
        shape: Math.random() < 0.09 ? SHAPE.HEART : (Math.random() < 0.14 ? SHAPE.STAR : SHAPE.DOT),
        maxLife: rand(1400, 3000)
      });
    }
  }

  /* =========================================================
     7. ONDAS DE LUZ
     ========================================================= */

  const ripples = [];
  function updateRipples(dt) {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      r.r += dt * 0.16;
      r.a -= dt * 0.0011;
      if (r.a <= 0) { ripples.splice(i, 1); continue; }
      if (!visible(r.x, r.y, DEPTH.MID, r.r + 60)) continue;
      ctx.save();
      ctx.globalAlpha = clamp(r.a, 0, 1);
      ctx.strokeStyle = 'rgba(255,212,135,0.85)';
      ctx.lineWidth = 1.2;
      if (Q.glow) { ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255,200,110,.6)'; }
      ctx.beginPath();
      ctx.arc(sx(r.x, DEPTH.MID), sy(r.y, DEPTH.MID), Math.max(r.r * scaleOf(DEPTH.MID), 1), 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  /* =========================================================
     8. GIRASOLES REPARTIDOS POR EL MUNDO
     ========================================================= */

  const sunflowers = [];

  function makeSunflower(x, y, depth, radius) {
    return {
      x, y, depth, r: radius,
      rot: rand(0, Math.PI * 2),
      rotSpeed: rand(0.00012, 0.00042) * (Math.random() < 0.5 ? -1 : 1),
      sway: rand(0, Math.PI * 2),
      swaySpeed: rand(0.0004, 0.0009),
      glow: rand(0.6, 1),
      excite: 0,
      lastEmit: 0
    };
  }

  function seedSunflowers() {
    const clusters = [
      { x: CENTER.x - 700, y: CENTER.y + 1250, n: 7 },
      { x: CENTER.x + 820, y: CENTER.y + 520, n: 6 },
      { x: CENTER.x - 900, y: CENTER.y - 900, n: 6 },
      { x: CENTER.x + 640, y: CENTER.y - 1500, n: 7 },
      { x: CENTER.x, y: CENTER.y + 1950, n: 8 }
    ];
    clusters.forEach(c => {
      for (let i = 0; i < c.n; i++) {
        const depth = pick([DEPTH.BG, DEPTH.BG, DEPTH.MID, DEPTH.MID, DEPTH.FG]);
        sunflowers.push(makeSunflower(
          c.x + rand(-520, 520),
          c.y + rand(-480, 480),
          depth,
          depth === DEPTH.BG ? rand(16, 30) : depth === DEPTH.MID ? rand(26, 48) : rand(44, 78)
        ));
      }
    });
    for (let i = 0; i < 22; i++) {
      const depth = pick([DEPTH.BG, DEPTH.BG, DEPTH.MID, DEPTH.FG]);
      sunflowers.push(makeSunflower(
        rand(180, WORLD.w - 180),
        rand(180, WORLD.h - 180),
        depth,
        depth === DEPTH.BG ? rand(14, 26) : depth === DEPTH.MID ? rand(24, 44) : rand(40, 70)
      ));
    }
  }
  seedSunflowers();

  function updateSunflowers(dt) {
    for (const s of sunflowers) {
      s.rot += s.rotSpeed * dt;
      s.sway += s.swaySpeed * dt;
      const dCam = Math.hypot(s.x - cam.x, s.y - cam.y);
      const dPtr = pointerWorld.active ? Math.hypot(s.x - pointerWorld.x, s.y - pointerWorld.y) : 1e9;
      const near = dCam < 620 || dPtr < 220;
      s.excite = lerp(s.excite, near ? 1 : 0, 0.02);
      if (near && now - s.lastEmit > (dPtr < 220 ? 160 : 430)) {
        s.lastEmit = now;
        spawnTemp(s.x + rand(-s.r * 0.5, s.r * 0.5), s.y + rand(-s.r * 0.5, s.r * 0.5), {
          vx: rand(-0.18, 0.18), vy: rand(-0.7, -0.2),
          size: rand(0.8, 2.1), alpha: rand(0.35, 0.8), maxLife: rand(1800, 3400)
        });
      }
    }
  }

  function drawSunflower(g, s) {
    if (!visible(s.x, s.y, s.depth, s.r * 2 + 40)) return;
    const sc = scaleOf(s.depth);
    const r = s.r * sc;
    if (r < 1.2) return;
    const X = sx(s.x, s.depth) + Math.sin(s.sway) * 4 * sc;
    const Y = sy(s.y, s.depth) + Math.cos(s.sway * 0.8) * 3 * sc;
    const far = s.depth === DEPTH.BG;
    const alpha = (far ? 0.42 : 0.82) * (0.75 + s.excite * 0.25) * s.glow;

    g.save();
    g.translate(X, Y);
    g.rotate(s.rot);
    g.globalAlpha = clamp(alpha, 0, 1);
    if (Q.glow) {
      g.shadowBlur = Q.blur * (far ? 0.8 : 1.6) * (0.6 + s.excite);
      g.shadowColor = 'rgba(255,196,86,0.85)';
    }

    const petals = far ? 9 : 14;
    for (let i = 0; i < petals; i++) {
      g.save();
      g.rotate((i / petals) * Math.PI * 2);
      const grad = g.createLinearGradient(0, -r * 0.3, 0, -r * 1.08);
      grad.addColorStop(0, `rgba(255,218,124,${far ? 0.7 : 0.96})`);
      grad.addColorStop(1, 'rgba(255,168,54,0.12)');
      g.fillStyle = grad;
      g.beginPath();
      g.ellipse(0, -r * 0.72, r * 0.2, r * 0.42, 0, 0, Math.PI * 2);
      g.fill();
      g.restore();
    }

    const cg = g.createRadialGradient(0, 0, r * 0.04, 0, 0, Math.max(r * 0.35, 0.5));
    cg.addColorStop(0, 'rgba(150,96,28,0.98)');
    cg.addColorStop(1, 'rgba(70,42,12,0.9)');
    g.fillStyle = cg;
    g.beginPath();
    g.arc(0, 0, r * 0.32, 0, Math.PI * 2);
    g.fill();

    g.restore();
    g.shadowBlur = 0;
  }

  const phraseNodes = [];

  function seedPhrases() {
    const used = {};
    // baraja del pool: cada punto del mundo recibe una frase DISTINTA,
    // así no se repite ninguna mientras se explora
    const bolsa = PHRASES.slice();
    for (let i = bolsa.length - 1; i > 0; i--) {
      const j = randInt(0, i);
      const tmp = bolsa[i]; bolsa[i] = bolsa[j]; bolsa[j] = tmp;
    }
    for (let i = 0; i < bolsa.length; i++) {
      const text = bolsa[i];
      const depth = pick([DEPTH.BG, DEPTH.BG, DEPTH.MID, DEPTH.MID, DEPTH.FG]);
      let x = 0, y = 0, tries = 0, key = '';
      do {
        x = rand(220, WORLD.w - 220);
        y = rand(220, WORLD.h - 220);
        key = Math.round(x / 320) + ',' + Math.round(y / 320);
        tries++;
      } while (tries < 10 && used[key]);
      used[key] = true;
      phraseNodes.push({
        text, x, y, depth,
        size: depth === DEPTH.BG ? rand(11, 15) : depth === DEPTH.MID ? rand(15, 20) : rand(20, 27),
        rot: rand(-0.09, 0.09),
        alpha: 0,
        target: 0,
        bob: rand(0, Math.PI * 2),
        bobSpeed: rand(0.0004, 0.001)
      });
    }
  }
  seedPhrases();

  function updatePhrases(dt) {
    for (const p of phraseNodes) {
      p.bob += p.bobSpeed * dt;
      // se encienden cuando el usuario se acerca
      const d = Math.hypot(p.x - cam.x, p.y - cam.y);
      const range = 950 / cam.zoom;
      const t = easeOutCubic(clamp(1 - d / range, 0, 1));
      p.target = t * (p.depth === DEPTH.BG ? 0.45 : p.depth === DEPTH.MID ? 0.8 : 0.95);
      p.alpha = lerp(p.alpha, p.target, 0.035);
    }
  }

  function drawPhrases(g, layer) {
    for (const p of phraseNodes) {
      if (p.depth !== layer || p.alpha < 0.02) continue;
      if (!visible(p.x, p.y, p.depth, 300)) continue;
      const sc = scaleOf(p.depth);
      const size = p.size * sc;
      if (size < 5) continue;
      g.save();
      g.translate(sx(p.x, p.depth), sy(p.y, p.depth) + Math.sin(p.bob) * 4 * sc);
      g.rotate(p.rot);
      g.globalAlpha = clamp(p.alpha, 0, 1);
      g.font = `italic ${size.toFixed(1)}px Georgia, "Times New Roman", serif`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      if (Q.glow) {
        g.shadowBlur = Q.blur * 0.9;
        g.shadowColor = 'rgba(255,205,115,0.8)';
      }
      g.fillStyle = p.depth === DEPTH.BG ? 'rgba(226,182,104,0.92)' : 'rgba(255,231,181,0.96)';
      g.fillText(p.text, 0, 0);
      g.restore();
      g.shadowBlur = 0;
    }
  }

  /* =========================================================
     10. FIGURAS: generación de puntos objetivo
     ========================================================= */

  function heartPoints(cx, cy, scale, count, fill) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      const t = rand(0, Math.PI * 2);
      const k = fill ? Math.sqrt(rand(0.06, 1)) : rand(0.93, 1.02);
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      pts.push({ x: cx + x * scale * k, y: cy + y * scale * k });
    }
    return pts;
  }

  function infinityPoints(cx, cy, scale, count) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      const t = (i / count) * Math.PI * 2 + rand(-0.04, 0.04);
      const d = 1 + Math.sin(t) * Math.sin(t);
      const k = rand(0.94, 1.06);
      pts.push({
        x: cx + (scale * Math.cos(t) / d) * k,
        y: cy + (scale * Math.sin(t) * Math.cos(t) / d) * k
      });
    }
    return pts;
  }

  function sunflowerFormPoints(cx, cy, scale, count) {
    const pts = [];
    const petals = 14;
    for (let i = 0; i < count; i++) {
      if (i % 4 === 0) {
        const r = Math.sqrt(rand(0, 1)) * scale * 3.4;
        const a = rand(0, Math.PI * 2);
        pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
      } else {
        const base = (randInt(0, petals - 1) / petals) * Math.PI * 2;
        const ang = base + rand(-0.11, 0.11);
        const rr = rand(3.6, 8.6) * scale;
        pts.push({ x: cx + Math.cos(ang) * rr, y: cy + Math.sin(ang) * rr * 0.95 });
      }
    }
    return pts;
  }

  function starPoints(cx, cy, scale, count) {
    const pts = [];
    for (let i = 0; i < count; i++) {
      const t = rand(0, Math.PI * 2);
      const spike = Math.abs(Math.cos(t * 2.5));
      const r = scale * (3 + 5 * spike) * rand(0.92, 1.04);
      pts.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r });
    }
    return pts;
  }

  /* =========================================================
     11. FORMACIONES (eventos dentro del universo)
     ========================================================= */

  const formations = [];

  function startFormation(cx, cy, kind, opts) {
    opts = opts || {};
    const radius = opts.radius || 1000;
    const wanted = opts.count || 130;

    // Sólo se reclutan partículas CERCANAS: el resto del universo sigue su vida.
    // Si en el primer radio no hay bastantes, se amplía la búsqueda.
    const pool = [];
    const taken = new Set();
    for (const factor of [1, 1.8, 3]) {
      if (pool.length >= wanted) break;
      const R = radius * factor;
      for (const p of mainParticles) {
        if (pool.length >= wanted) break;
        if (p.owner || taken.has(p)) continue;
        if (p.mode !== MODE.FREE && p.mode !== MODE.RETURN) continue;
        if (Math.hypot(p.x - cx, p.y - cy) < R) { pool.push(p); taken.add(p); }
      }
    }

    // Relleno: si aún hay pocas, nacen partículas alrededor para completar la figura.
    const minimo = Math.max(48, Math.floor(wanted * 0.55));
    const hold = opts.hold || 7000;
    while (pool.length < minimo) {
      const a = rand(0, Math.PI * 2);
      const r = rand(260, 700);
      const p = spawnTemp(cx + Math.cos(a) * r, cy + Math.sin(a) * r, {
        size: rand(1, 2.8),
        alpha: rand(0.5, 0.9),
        maxLife: hold + 16000   // sobrevive a todo el evento y se apaga después
      });
      if (!p) break;            // presupuesto agotado: seguimos con lo que haya
      pool.push(p);
    }
    if (pool.length < 24) return null;

    const scale = opts.scale || 9;
    let pts;
    if (kind === 'heart') pts = heartPoints(cx, cy, scale, pool.length, opts.fill !== false);
    else if (kind === 'infinity') pts = infinityPoints(cx, cy, scale * 16, pool.length);
    else if (kind === 'sunflower') pts = sunflowerFormPoints(cx, cy, scale * 1.15, pool.length);
    else pts = starPoints(cx, cy, scale * 1.3, pool.length);

    const f = {
      kind, cx, cy, scale,
      parts: pool,
      born: now,
      aliveSince: 0,
      hold: hold,
      state: 'forming',
      glow: 0,
      label: opts.label || null,
      labelAlpha: 0,
      released: false
    };

    pool.forEach((p, i) => {
      const tp = pts[i % pts.length];
      p.seek(tp.x, tp.y, rand(0, 900), rand(1300, 2300), f);
    });

    formations.push(f);

    // corriente dorada que acompaña la llegada
    for (let i = 0; i < Q.maxBurst; i++) {
      const a = rand(0, Math.PI * 2);
      spawnTemp(cx + Math.cos(a) * rand(80, 320), cy + Math.sin(a) * rand(80, 320), {
        vx: -Math.cos(a) * rand(0.4, 1), vy: -Math.sin(a) * rand(0.4, 1),
        size: rand(1, 2.6), maxLife: rand(2000, 3600)
      });
    }
    return f;
  }

  function updateFormations(dt) {
    for (let i = formations.length - 1; i >= 0; i--) {
      const f = formations[i];
      let held = 0;
      for (const p of f.parts) if (p.mode === MODE.HELD) held++;
      const ratio = held / f.parts.length;

      if (f.state === 'forming') {
        f.glow = lerp(f.glow, ratio, 0.05);
        if (ratio > 0.8) { f.state = 'alive'; f.aliveSince = now; }
        else if (now - f.born > 9000) { f.state = 'alive'; f.aliveSince = now; }
      } else if (f.state === 'alive') {
        f.glow = lerp(f.glow, 1, 0.04);
        if (f.label) f.labelAlpha = lerp(f.labelAlpha, 1, 0.03);
        if (Math.random() < 0.25) {
          const a = rand(0, Math.PI * 2);
          const r = f.scale * rand(10, 17);
          spawnTemp(f.cx + Math.cos(a) * r, f.cy + Math.sin(a) * r * 0.8, {
            vx: rand(-0.2, 0.2), vy: rand(-0.5, -0.1),
            size: rand(0.8, 2.2),
            shape: Math.random() < 0.18 ? SHAPE.STAR : (Math.random() < 0.12 ? SHAPE.HEART : SHAPE.DOT),
            maxLife: rand(1600, 3200)
          });
        }
        if (now - f.aliveSince > f.hold) f.state = 'fading';
      } else {
        f.glow = lerp(f.glow, 0, 0.03);
        if (f.label) f.labelAlpha = lerp(f.labelAlpha, 0, 0.04);
        if (!f.released) {
          f.released = true;
          f.parts.forEach(p => setTimeout(() => p.release(), rand(0, 900)));
        }
        if (f.glow < 0.05) formations.splice(i, 1);
      }
    }
  }

  function drawFormationGlow(g) {
    for (const f of formations) {
      if (f.glow < 0.03) continue;
      if (!visible(f.cx, f.cy, DEPTH.MID, f.scale * 24)) continue;
      const sc = scaleOf(DEPTH.MID);
      const X = sx(f.cx, DEPTH.MID), Y = sy(f.cy, DEPTH.MID);
      const breath = 1 + Math.sin(timeSec * 1.6) * 0.06;
      const R = Math.max(f.scale * 15 * sc * breath, 2);
      const grad = g.createRadialGradient(X, Y, 1, X, Y, R);
      grad.addColorStop(0, `rgba(255,205,110,${0.2 * f.glow})`);
      grad.addColorStop(0.45, `rgba(255,170,60,${0.08 * f.glow})`);
      grad.addColorStop(1, 'rgba(255,150,40,0)');
      g.globalAlpha = 1;
      g.fillStyle = grad;
      g.beginPath();
      g.arc(X, Y, R, 0, Math.PI * 2);
      g.fill();

      if (f.label && f.labelAlpha > 0.02) {
        const size = 26 * sc;
        if (size > 6) {
          g.save();
          g.globalAlpha = clamp(f.labelAlpha, 0, 1);
          g.font = `italic ${size.toFixed(1)}px Georgia, "Times New Roman", serif`;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          if (Q.glow) { g.shadowBlur = Q.blur * 1.6; g.shadowColor = 'rgba(255,200,110,.9)'; }
          g.fillStyle = 'rgba(255,238,198,0.98)';
          g.fillText(f.label, X, Y + f.scale * 1.4 * sc);
          g.restore();
          g.shadowBlur = 0;
        }
      }
    }
  }

  /* =========================================================
     12. ZONAS DESCUBRIBLES
     ========================================================= */

  const starRainDrops = [];
  function starRain(x, y) {
    const n = QUALITY === 'low' ? 12 : 26;
    for (let i = 0; i < n; i++) {
      starRainDrops.push({
        x: x + rand(-700, 700),
        y: y + rand(-900, -200),
        vx: rand(-0.4, -0.1),
        vy: rand(1.6, 3.4),
        len: rand(18, 46),
        a: rand(0.4, 0.95)
      });
    }
  }

  const zones = [
    {
      name: 'corazon', x: CENTER.x, y: CENTER.y, r: 520, cooldown: 16000, last: -1e9, inside: false,
      run(z) {
        startFormation(z.x, z.y, 'heart', {
          scale: 11, count: 190, radius: 1200, hold: 9000, label: 'Te amo ❤️'
        });
      }
    },
    {
      name: 'girasoles', x: CENTER.x - 700, y: CENTER.y + 1250, r: 520, cooldown: 15000, last: -1e9, inside: false,
      run(z) {
        startFormation(z.x, z.y, 'sunflower', { scale: 9, count: 150, radius: 1100, hold: 7000 });
      }
    },
    {
      name: 'infinito', x: CENTER.x + 820, y: CENTER.y - 1180, r: 520, cooldown: 15000, last: -1e9, inside: false,
      run(z) {
        startFormation(z.x, z.y, 'infinity', { scale: 12, count: 150, radius: 1100, hold: 8000, label: 'Sin final' });
      }
    },
    {
      name: 'estrellas', x: CENTER.x - 950, y: CENTER.y - 1350, r: 560, cooldown: 14000, last: -1e9, inside: false,
      run(z) {
        startFormation(z.x, z.y, 'star', { scale: 9, count: 120, radius: 1000, hold: 6000 });
        starRain(z.x, z.y);
      }
    },
    {
      name: 'jardin', x: CENTER.x + 700, y: CENTER.y + 1500, r: 560, cooldown: 14000, last: -1e9, inside: false,
      run(z) {
        for (let i = 0; i < Q.maxBurst * 2; i++) {
          spawnTemp(z.x + rand(-500, 500), z.y + rand(-400, 400), {
            vx: rand(-0.2, 0.2), vy: rand(-0.8, -0.2),
            size: rand(0.9, 2.6),
            shape: Math.random() < 0.2 ? SHAPE.HEART : SHAPE.DOT,
            maxLife: rand(2600, 5200)
          });
        }
      }
    },
    {
      name: 'corazon-sur', x: CENTER.x, y: CENTER.y + 2050, r: 520, cooldown: 16000, last: -1e9, inside: false,
      run(z) {
        startFormation(z.x, z.y, 'heart', { scale: 8, count: 140, radius: 1000, hold: 7000, label: 'Siempre tú' });
      }
    }
  ];

  function updateStarRain(dt) {
    for (let i = starRainDrops.length - 1; i >= 0; i--) {
      const d = starRainDrops[i];
      d.x += d.vx * dt * 0.06;
      d.y += d.vy * dt * 0.06;
      d.a -= dt * 0.00035;
      if (d.a <= 0) { starRainDrops.splice(i, 1); continue; }
      if (!visible(d.x, d.y, DEPTH.MID, 140)) continue;
      ctx.save();
      ctx.globalAlpha = clamp(d.a, 0, 1);
      ctx.strokeStyle = 'rgba(255,232,180,0.9)';
      ctx.lineWidth = 1.1;
      if (Q.glow) { ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(255,214,140,.8)'; }
      ctx.beginPath();
      ctx.moveTo(sx(d.x, DEPTH.MID), sy(d.y, DEPTH.MID));
      ctx.lineTo(sx(d.x - d.vx * d.len, DEPTH.MID), sy(d.y - d.vy * d.len, DEPTH.MID));
      ctx.stroke();
      ctx.restore();
    }
  }

  function updateZones() {
    for (const z of zones) {
      const d = Math.hypot(z.x - cam.x, z.y - cam.y);
      const was = z.inside;
      z.inside = d < z.r;
      if (z.inside && !was && now - z.last > z.cooldown) {
        z.last = now;
        z.run(z);
      }
    }
  }

  // insinuación luminosa de que hay algo cerca (sin interfaz)
  function drawZoneHalos(g) {
    for (const z of zones) {
      const d = Math.hypot(z.x - cam.x, z.y - cam.y);
      if (d > 1500 || !visible(z.x, z.y, DEPTH.MID, 500)) continue;
      const near = clamp(1 - d / 1500, 0, 1);
      const sc = scaleOf(DEPTH.MID);
      const X = sx(z.x, DEPTH.MID), Y = sy(z.y, DEPTH.MID);
      const R = Math.max(z.r * 0.55 * sc, 2);
      const pulse = 0.5 + 0.5 * Math.sin(timeSec * 0.9 + z.x * 0.001);
      const grad = g.createRadialGradient(X, Y, 1, X, Y, R);
      grad.addColorStop(0, `rgba(255,196,96,${0.05 * near * (0.6 + pulse * 0.4)})`);
      grad.addColorStop(1, 'rgba(255,170,60,0)');
      g.globalAlpha = 1;
      g.fillStyle = grad;
      g.beginPath();
      g.arc(X, Y, R, 0, Math.PI * 2);
      g.fill();
    }
  }

  /* =========================================================
     13. BRÚJULA (sólo si te alejas del corazón)
     ========================================================= */

  function updateCompass() {
    const heart = zones[0];
    const dx = heart.x - cam.x, dy = heart.y - cam.y;
    const d = Math.hypot(dx, dy);
    if (d > 1400) {
      compassEl.classList.add('visible');
      const ang = Math.atan2(dy, dx);
      const rad = Math.min(W, H) * 0.3;
      compassEl.style.transform = `translate(${(Math.cos(ang) * rad).toFixed(1)}px, ${(Math.sin(ang) * rad).toFixed(1)}px)`;
      compassArrow.style.transform = `rotate(${ang.toFixed(3)}rad)`;
    } else {
      compassEl.classList.remove('visible');
    }
  }

  /* =========================================================
     14. FONDO ATMOSFÉRICO
     ========================================================= */

  function drawBackground(g) {
    g.globalAlpha = 1;
    g.fillStyle = '#04030a';
    g.fillRect(0, 0, W, H);
    // resplandor anclado al corazón del mundo: orienta y da profundidad
    const heart = zones[0];
    const X = sx(heart.x, DEPTH.BG * 0.8), Y = sy(heart.y, DEPTH.BG * 0.8);
    const R = Math.max(W, H) * 0.95;
    const grad = g.createRadialGradient(X, Y, 1, X, Y, R);
    grad.addColorStop(0, 'rgba(48,32,10,0.85)');
    grad.addColorStop(0.35, 'rgba(24,16,8,0.5)');
    grad.addColorStop(1, 'rgba(4,3,10,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
  }

  /* =========================================================
     15. BUCLE PRINCIPAL
     ========================================================= */

  let now = performance.now();
  let last = now;
  let timeSec = 0;
  let holdEmit = 0;

  function loop(t) {
    now = t;
    const dt = Math.min(t - last, 50);
    last = t;
    timeSec = t / 1000;

    updateCamera(dt);

    if (started) {
      updateZones();
      updateSunflowers(dt);
      updatePhrases(dt);
      updateFormations(dt);
      updateCompass();

      if (holding && pointerWorld.active) {
        holdEmit += dt;
        if (holdEmit > 55) {
          holdEmit = 0;
          spawnTemp(pointerWorld.x + rand(-18, 18), pointerWorld.y + rand(-18, 18), {
            vx: rand(-0.35, 0.35), vy: rand(-0.8, -0.15),
            size: rand(0.9, 2.5), maxLife: rand(1200, 2600)
          });
        }
      }
    }

    // ---------- render por capas ----------
    drawBackground(ctx);
    drawZoneHalos(ctx);

    // lejos
    for (const p of bgParticles) { p.update(dt); p.draw(ctx); }
    for (const s of sunflowers) if (s.depth === DEPTH.BG) drawSunflower(ctx, s);
    drawPhrases(ctx, DEPTH.BG);

    // medio
    drawFormationGlow(ctx);
    for (const p of mainParticles) { p.update(dt); p.draw(ctx); }
    for (let i = temps.length - 1; i >= 0; i--) {
      const p = temps[i];
      p.update(dt);
      p.draw(ctx);
      if (p.dead) temps.splice(i, 1);
    }
    for (const s of sunflowers) if (s.depth === DEPTH.MID) drawSunflower(ctx, s);
    drawPhrases(ctx, DEPTH.MID);

    // cerca
    for (const s of sunflowers) if (s.depth === DEPTH.FG) drawSunflower(ctx, s);
    drawPhrases(ctx, DEPTH.FG);

    updateStarRain(dt);
    updateRipples(dt);

    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    requestAnimationFrame(loop);
  }

  /* =========================================================
     16. ARRANQUE
     ========================================================= */

  let hintTimer = null;
  function hideHint() {
    if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
    hintEl.classList.remove('visible');
  }

  function start() {
    if (started) return;
    started = true;
    introEl.classList.add('hidden');
    setTimeout(() => { introEl.style.display = 'none'; }, 1700);
    titleEl.classList.add('visible');

    touchBurst(cam.x, cam.y - 60);
    // viaje suave de entrada hacia el corazón del mundo
    setTimeout(() => { cam.tx = CENTER.x; cam.ty = CENTER.y + 200; }, 600);

    setTimeout(() => hintEl.classList.add('visible'), 1800);
    hintTimer = setTimeout(() => hintEl.classList.remove('visible'), 10000);
  }

  introEl.addEventListener('pointerdown', start);

  drawBackground(ctx);
  requestAnimationFrame(loop);

})();

</script>
</body>
