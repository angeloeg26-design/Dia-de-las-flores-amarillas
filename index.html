<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04030a">
<title>Feliz Día de las Flores Amarillas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Universo: todo se dibuja aquí -->
  <canvas id="scene"></canvas>

  <div id="vignette"></div>

  <!-- Título fijo en el espacio de pantalla -->
  <header id="titleBlock">
    <h1 id="titleMain">Feliz Día de las Flores</h1>
    <h2 id="titleSub">Amarillas <span class="flowerGlyph">🌻</span></h2>
  </header>

  <!-- Indicación mínima, desaparece sola -->
  <div id="hint">Arrastra para explorar</div>

  <!-- Brújula sutil: señala hacia el corazón si te alejas mucho -->
  <div id="compass"><span id="compassArrow">➜</span></div>

  <!-- Música de fondo: sólo arranca tras el toque inicial -->
  <audio id="bgm" src="audio/flores-amarillas.mp3" loop preload="auto" playsinline></audio>

  <!-- Control de sonido discreto -->
  <button id="soundToggle" type="button" aria-label="Activar o silenciar la música">♪</button>

  <!-- Pantalla inicial -->
  <div id="intro">
    <div id="introGlyph">✨</div>
    <div id="introText">Toca para entrar</div>
    <div id="introNote">con sonido</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
